name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the previous run. Keeps us inside the free
# Actions allowance and gives faster feedback on the commit that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Enables Turborepo's terminal output in CI logs.
  TURBO_TELEMETRY_DISABLED: 1
  # CI has no database or secrets; env validation is exercised locally and at
  # deploy time on Vercel, where the real values exist.
  SKIP_ENV_VALIDATION: "true"

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Turborepo compares against the previous commit to skip unchanged
          # packages, which needs more than a shallow clone.
          fetch-depth: 2

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
